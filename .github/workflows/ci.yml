name: ci

on:
  push:
    branches:
      - main
    paths: &ci-paths
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "patches/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths: *ci-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'sendspin/conformance'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: uv sync

      # Fails when src/conformance/_vendor/ was edited by hand or a patch in
      # patches/aiosendspin/ no longer produces the committed tree.
      - name: Check bundled aiosendspin matches a rebuild
        run: uv run python scripts/vendor_aiosendspin.py --check

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests
