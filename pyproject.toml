[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sendspin-conformance"
version = "0.1.0"
description = "Capability-aware conformance harness for Sendspin implementations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosendspin[server]",
  # The bundled aiosendspin's runtime and server dependencies, with the ranges its
  # pyproject.toml declares at the commit src/conformance/_vendor/VENDORED.md records.
  "aiohttp>=3.9.2",
  "av>=15.0.0",
  "cpace>=0.1.0",
  "cryptography>=42",
  "mashumaro>=3.14",
  "noiseprotocol>=0.3.1",
  "numpy>=1.26.0",
  "orjson>=3.10.0",
  "Pillow>=11.0.0",
  "zeroconf>=0.147",
]

[project.scripts]
conformance = "conformance.cli:main"
sendspin-validate = "conformance.validator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"conformance._vendor" = ["VENDORED.md"]
"conformance._vendor.aiosendspin" = ["LICENSE", "py.typed"]
